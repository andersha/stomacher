name: Stomacher
options:
  bundleIdPrefix: no.abrahamsen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  Stomacher:
    type: application
    platform: iOS
    sources:
      - Stomacher
    info:
      path: Stomacher/Info.plist
      properties:
        CFBundleDisplayName: Bringeduk
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.$(PRODUCT_BUNDLE_IDENTIFIER):
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Stomacher
            NSUbiquitousContainerSupportedFolderLevels: Any
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Bringeduk pattern
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - no.abrahamsen.stomacher.pattern
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: no.abrahamsen.stomacher.pattern
            UTTypeDescription: Bringeduk pattern
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - stom
              public.mime-type:
                - application/vnd.no.abrahamsen.stomacher.pattern+json
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Stomacher/Stomacher.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: no.abrahamsen.stomacher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
